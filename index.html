<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bono para Zurielys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap">
<style>
/* Layout: one centered stage; envelope at rest, card rises out on tap. Single dark look by choice. */
:root {
  --night: #0b1530;
  --navy: #13224a;
  --navy-2: #1a2d5c;
  --navy-3: #0f1b3d;
  --gold: #d4a94f;
  --gold-hi: #f3d99a;
  --cream: #f6edd9;
  --ink-soft: #b9c2da;
  --f-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-script: "Great Vibes", "Brush Script MT", cursive;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 30%, #1b2c5a 0%, var(--night) 60%);
  background-color: var(--night);
  color: var(--cream);
  font-family: var(--f-display);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.wrap {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px;
  padding-block: 24px;
  box-sizing: border-box;
}
.hint {
  font-size: 1.05rem; letter-spacing: .22em; text-transform: uppercase;
  color: var(--gold-hi); opacity: .85; text-align: center;
  transition: opacity .4s;
  animation: pulse 2.2s ease-in-out infinite;
}
.opened .hint { opacity: 0; animation: none; }
@keyframes pulse { 50% { opacity: .45; } }

.stage {
  --w: min(520px, 86vw);
  width: var(--w);
  aspect-ratio: 3 / 2;
  max-width: 100%;
  position: relative;
  margin-top: calc(var(--w) * .28);
  perspective: 1400px;
  cursor: pointer;
  border: 0; background: none; padding: 0; color: inherit; font: inherit;
  -webkit-tap-highlight-color: transparent;
}
.stage:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 10px; border-radius: 6px; }

.env-back, .card, .front, .flap { position: absolute; }
.env-back {
  inset: 0; border-radius: 6px;
  background: linear-gradient(160deg, var(--navy-2), var(--navy-3));
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), inset 0 0 0 1px rgba(212,169,79,.35);
}
.card {
  left: 4%; right: 4%; top: 5%;
  aspect-ratio: 3 / 2;
  border-radius: 4px; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
  z-index: 2;
  transform: translateY(0);
  transition: transform .9s cubic-bezier(.2,.8,.2,1);
}
.card img { display: block; width: 100%; height: 100%; object-fit: cover; }

.front {
  inset: 0; z-index: 3; pointer-events: none;
}
.front svg { width: 100%; height: 100%; display: block; }
.to {
  position: absolute; left: 0; right: 0; bottom: 11%;
  text-align: center; z-index: 4; pointer-events: none;
  transition: opacity .4s;
}
.to small { display: block; font-size: clamp(.7rem, 2.4vw, .9rem); letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.to span { font-family: var(--f-script); font-size: clamp(1.7rem, 7vw, 2.6rem); color: var(--gold-hi); line-height: 1.1; }

.flap {
  left: 0; right: 0; top: 0; height: 58%;
  z-index: 5;
  transform-origin: top center;
  transform: rotateX(0deg);
  transition: transform .7s cubic-bezier(.5,0,.3,1), z-index 0s .35s;
}
.flap svg { width: 100%; height: 100%; display: block; overflow: visible; }

.seal {
  position: absolute; left: 50%; top: 58%; z-index: 6;
  width: clamp(54px, 15vw, 76px); aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 45%, #9a7428 100%);
  box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 4px rgba(154,116,40,.55);
  display: grid; place-items: center;
  font-family: var(--f-script); font-size: clamp(1.8rem, 6vw, 2.5rem); color: #6e5016;
  transition: transform .45s ease, opacity .45s ease;
}

/* Opening sequence */
.opened .seal { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
.opened .to { opacity: 0; }
.opened .flap { transform: rotateX(180deg); z-index: 1; }
.rising .card { transform: translateY(-62%); }
.out .card { z-index: 7; transform: translateY(-34%) scale(1.12); }

.again {
  font: inherit; font-size: .95rem; letter-spacing: .2em; text-transform: uppercase;
  color: var(--gold-hi); background: transparent;
  border: 1px solid rgba(212,169,79,.6); border-radius: 999px;
  padding: 10px 22px; cursor: pointer;
}
.again:hover { background: rgba(212,169,79,.12); }
.again:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

canvas { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  .card, .flap, .seal, .to { transition-duration: .01s; }
  .hint { animation: none; }
}
</style>

</head>

<script>
(function () {
  const wrap = document.getElementById('wrap');
  const stage = document.getElementById('stage');
  const again = document.getElementById('again');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let state = 'closed', timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, reduce ? 0 : ms));

  function open() {
    if (state !== 'closed') return;
    state = 'opening';
    wrap.classList.add('opened');
    later(() => wrap.classList.add('rising'), 650);
    later(() => { wrap.classList.add('out'); burst(); }, 1500);
    later(() => { state = 'open'; again.hidden = false; stage.setAttribute('aria-label', 'Bono de regalo abierto'); }, 2300);
  }
  function close() {
    timers.forEach(clearTimeout); timers = [];
    again.hidden = true;
    wrap.classList.remove('out');
    later(() => wrap.classList.remove('rising'), 500);
    later(() => wrap.classList.remove('opened'), 1300);
    later(() => { state = 'closed'; stage.setAttribute('aria-label', 'Abrir el sobre del bono de regalo'); }, 2000);
  }
  stage.addEventListener('click', open);
  again.addEventListener('click', close);

  // Gold sparkle burst
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let parts = [], raf = 0;
  function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', size); size();
  function burst() {
    if (reduce) return;
    const r = stage.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height * .2;
    const cols = ['#f3d99a', '#d4a94f', '#fff4d6', '#b8862e'];
    for (let i = 0; i < 110; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, life: 1, r: 1.5 + Math.random() * 3, c: cols[i % 4], spin: Math.random() < .4 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    const d = devicePixelRatio;
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .985; p.life -= .012;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      if (p.spin) {
        ctx.save(); ctx.translate(p.x * d, p.y * d); ctx.rotate(p.life * 8);
        ctx.fillRect(-p.r * d, -p.r * .4 * d, p.r * 2 * d, p.r * .8 * d); ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x * d, p.y * d, p.r * d * .7, 0, 7); ctx.fill();
      }
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) ctx.clearRect(0, 0, cv.width, cv.height);
  }
})();
</script>
